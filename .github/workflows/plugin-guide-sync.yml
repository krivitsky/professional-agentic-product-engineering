name: plugin-guide-sync

# Three invariants for the pape plugin:
#   1. its bundled guide.md matches the canonical guide.md at the repo root
#   2. every tip the plugin's skills cite actually exists in guide.md
#   3. the names in the manifests, the docs, and the skill dirs all agree
# (2) matters because the skills cite ~25 tips by number; renumber or remove a
# tip in guide.md and nothing else in the repo notices.
# (3) matters because the install snippet and the `/pape:<skill>` commands are
# copied across five docs by hand; a rename that misses one ships a command
# nobody can run.

# The paths list must cover every file the jobs below READ, not just the ones
# they're "about". The name check greps README.md, CLAUDE.md, AGENTS.md and the
# plugin README — a rename that misses one of those is the exact failure this
# workflow exists to catch, so a trigger list that omits them makes the check
# unreachable from the most likely commit.
# (GitHub Actions does not support YAML anchors, so the list is written twice.)
on:
  push:
    paths:
      - "guide.md"
      - "plugins/pape/**"
      - ".claude-plugin/marketplace.json"
      - "README.md"
      - "CLAUDE.md"
      - "AGENTS.md"
      - "scripts/**"
      - "web/**"
      - "wiki/**"
      - ".github/workflows/plugin-guide-sync.yml"
  pull_request:
    paths:
      - "guide.md"
      - "plugins/pape/**"
      - ".claude-plugin/marketplace.json"
      - "README.md"
      - "CLAUDE.md"
      - "AGENTS.md"
      - "scripts/**"
      - "web/**"
      - "wiki/**"
      - ".github/workflows/plugin-guide-sync.yml"

jobs:
  check-sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Compare bundled guide to canonical
        run: |
          if ! diff -q guide.md plugins/pape/guide.md; then
            echo "::error::plugins/pape/guide.md is out of sync with guide.md. Run ./scripts/sync-plugin.sh and commit."
            exit 1
          fi
          echo "In sync."

      - name: Every cited tip exists in guide.md
        run: |
          fail=0

          # Collect citations in every form the skills use and normalise them
          # all to a tip-T-N anchor:
          #   URL/anchor form ..... #tip-4-2
          #   prose form .......... "Tip 4.2", "[Tip 4.2]"
          #   registry field ...... "tip: 4.2"
          {
            grep -rhoE '#tip-[0-9]+-[0-9]+' plugins/pape/skills/ 2>/dev/null | sed 's/^#//'
            grep -rhoE '\bTips? [0-9]+\.[0-9]+' plugins/pape/skills/ 2>/dev/null \
              | sed -E 's/.* ([0-9]+)\.([0-9]+)/tip-\1-\2/'
            grep -rhoE 'tip: +[0-9]+\.[0-9]+' plugins/pape/skills/ 2>/dev/null \
              | sed -E 's/tip: +([0-9]+)\.([0-9]+)/tip-\1-\2/'
          } | sort -u > /tmp/cited.txt || true

          while read -r anchor; do
            [ -z "$anchor" ] && continue
            if ! grep -q "<a id=\"$anchor\"></a>" guide.md; then
              echo "::error::plugin skills cite $anchor, but guide.md has no <a id=\"$anchor\"></a>. A tip was renumbered, renamed away, or invented."
              fail=1
            fi
          done < /tmp/cited.txt
          echo "checked $(wc -l < /tmp/cited.txt) distinct tip anchors"

          # Live-site links must point at the tier that owns the tip:
          # tier-5#tip-5-4 is right, tier-4#tip-5-4 is a silent 404-to-nowhere.
          grep -rhoE 'tier-[0-9]+#tip-[0-9]+-[0-9]+' plugins/pape/skills/ 2>/dev/null \
            | sort -u | while read -r link; do
              page_tier="${link%%#*}"; page_tier="${page_tier#tier-}"
              tip_tier="${link##*#tip-}"; tip_tier="${tip_tier%%-*}"
              if [ "$page_tier" != "$tip_tier" ]; then
                echo "::error::$link points at the wrong tier page — Tip $tip_tier.x lives on tier-$tip_tier."
                exit 1
              fi
            done || fail=1

          [ "$fail" = "0" ] || exit 1
          echo "All tip citations resolve."

      # A `: ` inside an unquoted description silently invalidated harness-audit's
      # frontmatter once. Claude Code's lenient reader still loaded it, so nothing
      # surfaced — but a strict parser drops every field, taking the description
      # (and with it every natural-language trigger) with it.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Every SKILL.md has parseable frontmatter
        run: |
          python -m pip install --quiet pyyaml
          python - <<'PY'
          import sys, pathlib, yaml
          fail = False
          for p in sorted(pathlib.Path('plugins/pape/skills').glob('*/SKILL.md')):
              raw = p.read_text()
              if not raw.startswith('---\n'):
                  print(f"::error file={p}::no YAML frontmatter"); fail = True; continue
              block = raw.split('---\n', 2)[1]
              try:
                  meta = yaml.safe_load(block)
              except yaml.YAMLError as e:
                  print(f"::error file={p}::frontmatter does not parse: {e}"); fail = True; continue
              for key in ('name', 'description'):
                  if not meta.get(key):
                      print(f"::error file={p}::frontmatter is missing '{key}'"); fail = True
              if meta.get('name') != p.parent.name:
                  print(f"::error file={p}::frontmatter name '{meta.get('name')}' "
                        f"!= directory '{p.parent.name}' — the slash command would not resolve")
                  fail = True
              print(f"  ok {p} -> /pape:{meta.get('name')}")
          sys.exit(1 if fail else 0)
          PY

      # The site is generated from guide.md, and build.mjs fails on an unresolved
      # anchor. It also silently ships a page that is in no NAV group — reachable
      # by URL and sitemap, but with no sidebar link and a wrong "next" pager.
      - name: Site builds, and every page is reachable
        run: |
          cd web && node build.mjs > /tmp/build.log || { cat /tmp/build.log; exit 1; }
          node - <<'JS'
          const { readFileSync, readdirSync } = require('fs');
          const src = readFileSync('build.mjs', 'utf8');
          const nav = [...src.matchAll(/slugs:\s*\[([^\]]*)\]/g)]
            .flatMap(m => [...m[1].matchAll(/'([^']+)'/g)].map(x => x[1]));
          const built = readdirSync('dist').filter(f => f.endsWith('.html')).map(f => f.replace(/\.html$/, ''));
          const tiers = built.filter(s => /^tier-\d+$/.test(s));            // NAV takes these from tierSlugs
          const known = new Set([...nav, ...tiers]);
          const orphans = built.filter(s => !known.has(s));
          if (orphans.length) {
            console.log(`::error::built but absent from NAV (no sidebar link, wrong pager): ${orphans.join(', ')}`);
            process.exit(1);
          }
          console.log(`  ${built.length} pages built, all reachable from NAV`);
          JS

      - name: Manifests, docs and skill dirs agree on the names
        run: |
          fail=0
          market=$(jq -r '.name' .claude-plugin/marketplace.json)
          entry=$(jq -r '.plugins[0].name' .claude-plugin/marketplace.json)
          source=$(jq -r '.plugins[0].source' .claude-plugin/marketplace.json)
          plugin=$(jq -r '.name' plugins/pape/.claude-plugin/plugin.json)

          # The marketplace entry and the plugin's own manifest must be one name,
          # and `source` must point at a directory that exists.
          if [ "$entry" != "$plugin" ]; then
            echo "::error::marketplace entry is '$entry' but plugin.json says '$plugin'."
            fail=1
          fi
          if [ ! -d "$source" ]; then
            echo "::error::marketplace source '$source' is not a directory."
            fail=1
          fi

          # Every documented install line must be the real <plugin>@<marketplace>.
          want="/plugin install ${plugin}@${market}"
          grep -rhoE '/plugin install [a-z0-9-]+@[a-z0-9-]+' \
            README.md guide.md CLAUDE.md AGENTS.md plugins/pape/README.md 2>/dev/null \
            | sort -u | while read -r got; do
              if [ "$got" != "$want" ]; then
                echo "::error::docs say '$got' but the manifests say '$want'."
                exit 1
              fi
            done || fail=1

          # Every /<plugin>:<skill> command referenced anywhere must resolve to a
          # skill directory that exists.
          grep -rhoE "/${plugin}:[a-z0-9-]+" \
            README.md guide.md CLAUDE.md AGENTS.md plugins/pape/README.md plugins/pape/skills/ 2>/dev/null \
            | sort -u | while read -r cmd; do
              skill="${cmd##*:}"
              if [ ! -f "plugins/pape/skills/${skill}/SKILL.md" ]; then
                echo "::error::'$cmd' is referenced but plugins/pape/skills/${skill}/SKILL.md does not exist."
                exit 1
              fi
            done || fail=1

          # A stale plugin path in the docs means a rename missed a file.
          if grep -rn 'plugins/agentic-coach' \
               README.md guide.md CLAUDE.md AGENTS.md scripts/ web/build.mjs 2>/dev/null; then
            echo "::error::stale 'plugins/agentic-coach' path — the plugin directory is plugins/pape."
            fail=1
          fi

          [ "$fail" = "0" ] || exit 1
          echo "Names agree: ${plugin}@${market}, source ${source}."
